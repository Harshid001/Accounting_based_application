name: CI

on:
  push:
    branches: [main]
    tags: ['firmdesk-desktop-v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci || npm install
      - run: npm run verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        shell: [web, desktop]
    env:
      VITE_APP_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      # Shell matrix (spec §11): verify passes in BOTH shell modes.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:${{ matrix.shell }}
      - run: npm run build:${{ matrix.shell }}
      - name: website build asset check
        if: matrix.shell == 'web'
        run: |
          if [ ! -d "dist-website/assets" ] || [ -z "$(ls -A dist-website/assets)" ]; then
            echo "::error::website build generated no assets"; exit 1
          fi
      - name: bundle isolation check (desktop)
        if: matrix.shell == 'desktop'
        run: |
          if grep -rlE "PortalLayout|PortalOverview|LandingFooter|TeamPage" dist-desktop/assets >/dev/null 2>&1; then
            echo "::error::desktop bundle contains portal route code"; exit 1
          fi

  desktop-build:
    name: desktop (tauri)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: frontend
    # Main pushes: compile-check the Rust shell only (no bundling, so no
    # updater signing env needed — `createUpdaterArtifacts` requires the
    # private key, which only exists on release tags). Tags: full NSIS
    # bundle + portable exe + signed updater manifest, published as a
    # draft release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/firmdesk-desktop-v')
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm ci || npm install
      # The desktop bundle bakes in the API origin; env.ts throws at boot
      # without it. Same value as .env.desktop.example documents.
      - name: rust compile check (main, no bundle)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = '${{ vars.DESKTOP_API_BASE_URL || 'https://api.jvaccounting.in/api/v1' }}'
          $env:VITE_APP_NAME = 'FirmDesk'
          $env:VITE_APP_SHELL = 'desktop'
          npm run build:desktop
          Set-Location src-tauri
          cargo build --release --features custom-protocol
      - name: portable exe artifact (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmdesk-portable
          path: frontend/src-tauri/target/release/firmdesk.exe
          if-no-files-found: warn
      # Signed release with updater manifest, only on version tags and
      # only on the canonical repo (the mirror push remote must not
      # produce a second, divergent release; the updater endpoint and
      # download URLs point at Harshid001/Accounting_based_website).
      - name: tauri release (tag)
        id: tauri_release
        if: startsWith(github.ref, 'refs/tags/firmdesk-desktop-v') && github.repository == 'Harshid001/Accounting_based_website'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://api.jvaccounting.in/api/v1' }}
          VITE_APP_NAME: FirmDesk
          VITE_APP_SHELL: desktop
          # Updater signing keys live in GitHub encrypted secrets; the
          # public key goes in tauri.conf.json, the private key never
          # appears in the repo or logs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          # package.json has no "tauri" script (build:desktop/desktop:dev
          # instead), so point the action at the local CLI directly.
          tauriScript: 'npx tauri'
          tagName: firmdesk-desktop-v__VERSION__
          releaseName: 'FirmDesk Desktop v__VERSION__'
          releaseBody: 'NSIS installer for admin & staff. Run the smoke checklist in docs/DESKTOP_AGENT_RUNBOOK.md before deploying.'
          releaseDraft: true
          # We bundle NSIS only (no MSI), so latest.json must point at it.
          updaterJsonPreferNsis: true
      # Portable exe (spec D4: NSIS installer + portable exe): the raw
      # custom-protocol binary tauri build already produced, attached to
      # the same draft release as an extra asset.
      - name: portable exe release asset (tag)
        if: startsWith(github.ref, 'refs/tags/firmdesk-desktop-v') && github.repository == 'Harshid001/Accounting_based_website'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri_release.outputs.appVersion }}"
          $tag = "firmdesk-desktop-v$version"
          $portable = "FirmDesk-$version-portable-x64.exe"
          Copy-Item "src-tauri/target/release/firmdesk.exe" $portable
          gh release upload $tag $portable --repo $env:GITHUB_REPOSITORY --clobber
