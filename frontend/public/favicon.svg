<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JV Tax Consultancy">
  <defs>
    <linearGradient id="gold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffb15c"/>
      <stop offset="30%" stop-color="#ff8a1f"/>
      <stop offset="70%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#c24f00"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Obsidian background pill -->
  <rect width="64" height="64" rx="14" fill="url(#navy)"/>

  <!-- Outer burnt orange ring -->
  <circle cx="32" cy="32" r="29.5" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5" fill="none"/>

  <!-- Cardinal diamond accents -->
  <path d="M 32 1.5 L 33 2.5 L 32 3.5 L 31 2.5 Z" fill="url(#gold)"/>
  <path d="M 32 60.5 L 33 61.5 L 32 62.5 L 31 61.5 Z" fill="url(#gold)"/>
  <path d="M 1.5 32 L 2.5 33 L 3.5 32 L 2.5 31 Z" fill="url(#gold)"/>
  <path d="M 60.5 32 L 61.5 33 L 62.5 32 L 61.5 31 Z" fill="url(#gold)"/>

  <!-- Letter V (burnt orange) -->
  <path d="M 28 22 L 39 53 L 56 13 H 49 L 39 42 L 32 22 Z" fill="url(#gold)"/>

  <!-- J separator stroke (clearance gap) -->
  <path d="M 14 13 H 32 V 18 H 30.5 V 40 C 30.5 48.5 22.5 53 14 53 C 7.5 53 6.5 46.5 6.5 39 H 13 C 13 43.5 15.5 47 19.5 47 C 23.5 47 24 43.5 24 40 V 18 H 14 Z"
    stroke="#171717" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <!-- Letter J (warm white) -->
  <path d="M 14 13 H 32 V 18 H 30.5 V 40 C 30.5 48.5 22.5 53 14 53 C 7.5 53 6.5 46.5 6.5 39 H 13 C 13 43.5 15.5 47 19.5 47 C 23.5 47 24 43.5 24 40 V 18 H 14 Z"
    fill="#f5f2ed"/>

  <!-- Apex diamond -->
  <path d="M 52.5 10.5 L 54.5 13 L 52.5 15.5 L 50.5 13 Z" fill="url(#gold)"/>
</svg>
